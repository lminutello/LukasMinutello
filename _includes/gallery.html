{% if include.images %}
<div class="gallery">
  {% for img in include.images %}
  <figure>
    {% assign ext = img.src | split: "." | last %}
    {% if ext == "mp4" %}
    <video src="{{ img.src | relative_url }}" autoplay muted loop playsinline></video>
    {% else %}
    <a href="{{ img.src | relative_url }}" data-lightbox data-caption="{{ img.caption }}"><img src="{{ img.src | relative_url }}" alt="{{ img.alt | default: page.title }}" loading="lazy"></a>
    {% endif %}
    {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
  </figure>
  {% endfor %}
</div>
{% endif %}
