<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ "/" | relative_url }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/projects/' %}active{% endif %}" href="{{ "/projects/" | relative_url }}">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/resume/' %}active{% endif %}" href="{{ "/resume/" | relative_url }}">Resume</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="text-center">
    <div class="container">
      <div>
        <a href="#" data-bs-toggle="modal" data-bs-target="#contactModal"><i class="bi bi-person-lines-fill"></i> Contact</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener"><i class="bi bi-linkedin"></i> LinkedIn</a>
      </div>
      <div class="copyright">&copy; <span id="year">{{ 'now' | date: '%Y' }}</span> {{ site.name }}</div>
    </div>
  </footer>
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered contact-dialog">
      <div class="modal-content contact-card">
        <div class="contact-head">
          <h2 id="contactModalLabel">Get in touch</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="contact-body">
          <div class="contact-row">
            <i class="bi bi-envelope"></i>
            <a href="mailto:{{ site.email }}">{{ site.email }}</a>
            <button type="button" class="copy-btn" data-copy="{{ site.email }}" aria-label="Copy email"><i class="bi bi-clipboard"></i></button>
          </div>
          <div class="contact-row">
            <i class="bi bi-telephone"></i>
            <a href="tel:+1{{ site.phone | remove: '-' }}">{{ site.phone }}</a>
            <button type="button" class="copy-btn" data-copy="{{ site.phone }}" aria-label="Copy phone number"><i class="bi bi-clipboard"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(btn.dataset.copy).then(function () {
          btn.innerHTML = '<i class="bi bi-check2"></i>';
          setTimeout(function () { btn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 1500);
        });
      });
    });
  </script>
</body>
</html>
