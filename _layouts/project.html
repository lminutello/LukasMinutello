---
layout: default
---

<article class="prose" style="max-width: 820px;">
  <div class="project-header">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
    {% if page.technologies %}<div>{% for t in page.technologies %}<span class="tag">{{ t }}</span>{% endfor %}</div>{% endif %}
  </div>

  {% if page.image %}<img class="project-hero" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}

  <div class="project-body">
    {{ content }}
  </div>

  {% include gallery.html images=page.gallery %}

  <a href="{{ "/projects/" | relative_url }}" class="back-arrow"><i class="bi bi-arrow-left"></i> Back to projects</a>
</article>
